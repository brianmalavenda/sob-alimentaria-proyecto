# docker-compose.yml
version: '3.8'

services:
  # 1. Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: postgres_comidas
    restart: always
    environment:
      - .env
    ports:
      - "5432:5432" # Expuesto por si quieres conectar DBeaver, pgAdmin, etc.
    volumes:
      - ./db:/app/db
    networks:
      - red_sob_alimentaria

  # 2. Backend (Node + Express + Prisma)
  backend:
    build: ./backend
    container_name: backend_comidas
    ports:
      - "5000:5000"
    environment:
      - .env
    volumes:
      - ./backend:/app          # Hot-reload de código
      - /app/node_modules       # Aisla dependencias del contenedor
    depends_on:
      - postgres                # El backend espera a que Postgres esté listo
    networks:
      - red_sob_alimentaria

  # 3. Frontend (React + Vite)
  frontend:
    build: ./frontend
    container_name: frontend_comidas
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - red_sob_alimentaria

volumes:
  db: # Aquí se guardan los datos de Postgres permanentemente

networks:
  - red_sob_alimentaria:
    driver: bridge