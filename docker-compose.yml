services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sob-alimentaria-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:./db/custom.db
      - NEXTAUTH_URL=http://sob.local        # o la IP/hostname que uses en la LAN
    volumes:
      - /db:/app/db                        # persistencia de la base sqlite
    expose:
      - "3000"
    networks:
      - sob_net

