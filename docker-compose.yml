services:
  postgres:
    image: postgres:16-alpine
    container_name: sob-alimentaria-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - /docker/sob-alimentaria-app/db/postgres-data:/var/lib/postgresql/data
    networks:
      - sob_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sob-alimentaria-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    ports:
      - "3000:3000"
    volumes:
      - /docker/sob-alimentaria-app/db:/app/db
    networks:
      - sob_net

networks:
  sob_net:
    driver: bridge