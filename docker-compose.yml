services:
  postgres:
    image: postgres:16-alpine
    container_name: sob-alimentaria-db
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=admin_negocio
      - POSTGRES_PASSWORD=clave_segura_123
      - POSTGRES_DB=comidas_db
    ports:
      - "5432:5432"
    volumes:
      - ./db/postgres-data:/var/lib/postgresql/data
    networks:
      - sob_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_negocio -d comidas_db"]
      interval: 5s
      timeout: 5s
      retries: 10

    # image: postgres:16-alpine
    # container_name: sob-alimentaria-db
    # restart: unless-stopped
    # environment:
    #   POSTGRES_USER: sob_user
    #   POSTGRES_PASSWORD: sob_password
    #   POSTGRES_DB: sob_db
    # ports:
    #   - "5432:5432"
    # volumes:
    #   - postgres_data:/var/lib/postgresql/data
    # networks:
    #   - sob_net
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sob-alimentaria-app
    restart: unless-stopped
    depends_on:
      - postgres:
          condition: service_healthy      
    environment:
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=postgresql://sob_user:sob_password@postgres:5432/sob_db?schema=public
      - NEXTAUTH_URL=http://localhost:3000
    command: >
      sh -c "
        npx prisma migrate deploy &&
        if [ \"$$DEBUG\" = \"true\" ]; then
          echo '=== MODO DEBUG DETECTADO: Ejecutando seed... ===' &&
          npx prisma db seed;
        fi &&
        npm run start:prod
      "
    ports:
      - "3000:3000"
    volumes:
      - ./db:/app/db
    networks:
      - sob_net

  # caddy:
  #   image: caddy:2-alpine
  #   container_name: sob-alimentaria-caddy
